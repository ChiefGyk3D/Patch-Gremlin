# On a version tag: build the tarball the old release.yml built, then publish
# it with SHA256SUMS, a keyless cosign bundle and build provenance, through
# ChiefGyk3D/git-your-ship-together. A pull request builds and checks only.
name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/artifact-release.yml@faba0b7d1ab65e9033bef1acfa93d6d57b5808c0 # v1.21.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      build-command: |
        mkdir -p dist
        tar -czf "dist/patch-gremlin-v${VERSION}.tar.gz" \
          --exclude='.git' --exclude='.github' --exclude='dist' .
      artifacts: dist/patch-gremlin-*.tar.gz
      verify-command: |
        for file in setup-unattended-upgrades.sh update-notifier.sh uninstall.sh \
          config.example.sh README.md test-deployment.sh diagnose-config.sh \
          health-check.sh configure-verbosity.sh fix-verbose-now.sh; do
          test -f "$file" || { echo "missing: $file"; exit 1; }
        done
        for script in setup-unattended-upgrades.sh update-notifier.sh uninstall.sh; do
          test -x "$script" || { echo "not executable: $script"; exit 1; }
        done
      release-notes-command: |
        echo "# Patch Gremlin v${VERSION}"
        echo
        echo "## Installation"
        echo '```bash'
        echo "curl -sL https://github.com/ChiefGyk3D/Patch-Gremlin/archive/v${VERSION}.tar.gz | tar xz"
        echo "cd Patch-Gremlin-${VERSION}"
        echo "sudo -E bash setup-unattended-upgrades.sh"
        echo '```'
      egress-policy: block
