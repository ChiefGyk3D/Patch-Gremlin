---
name: Linting and Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # -S style catches the classes of bug that shipped in v1 and that the
      # old `-S warning` gate was blind to: SC2181 ($? after an assignment),
      # SC2028 (echo "\n"), SC2164, SC2155.
      - name: Run ShellCheck on every script
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf 'Checking %d scripts\n' "${#scripts[@]}"
          shellcheck -x -S style "${scripts[@]}"

  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          config_file: .yamllint.yml
          strict: true

  executable-bits:
    name: Script Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Every top-level script must be executable
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r script; do
            if [ ! -x "$script" ]; then
              echo "::error file=$script::not executable (chmod +x $script)"
              rc=1
            fi
          done < <(find . -maxdepth 2 -name '*.sh' -not -path './.git/*' -not -path './tests/*')
          exit $rc
