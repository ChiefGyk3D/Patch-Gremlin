---
name: Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Run the bats suite
        run: bats --print-output-on-failure tests/

      - name: Verify every script parses
        run: |
          set -euo pipefail
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

  compatibility:
    name: Staged install on ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:9
          - fedora:41
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install prerequisites
        shell: bash
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y bash curl ca-certificates git bats python3
          else
            (dnf install -y bash curl ca-certificates git bats python3 || \
             dnf install -y bash curl ca-certificates git python3)
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stage a full non-interactive install
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          PATCH_GREMLIN_ROOT="$root" \
          UPDATE_TYPE=security UPDATE_SCHEDULE=daily UPDATE_TIME=03:15 \
          SECRET_MODE=local \
          LOCAL_DISCORD_WEBHOOK='https://discord.com/api/webhooks/1/x' \
          VERBOSE_LOGGING=false AUTO_REBOOT=true \
            ./setup-unattended-upgrades.sh --non-interactive

          echo "--- staged tree ---"
          find "$root" -type f | sort

          test -f "$root/usr/local/bin/update-notifier.sh"
          test -f "$root/usr/local/bin/patch-gremlin-health-check.sh"
          test -f "$root/etc/systemd/system/update-notifier.service"
          test "$(stat -c '%a' "$root/etc/update-notifier/secrets.conf")" = 600
          test ! -f "$root/etc/apt/apt.conf.d/99patch-gremlin-notification"

          echo "--- uninstall ---"
          PATCH_GREMLIN_ROOT="$root" ./uninstall.sh --non-interactive
          test ! -e "$root/etc/update-notifier"

      - name: Run the bats suite where available
        shell: bash
        run: |
          if command -v bats >/dev/null; then
            bats --print-output-on-failure tests/
          else
            echo "bats unavailable on this image; staged install check covered it"
          fi

  notifier-payloads:
    name: Validate notification payloads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3

      - name: Assert every platform payload is valid JSON
        run: bats --print-output-on-failure tests/notifier.bats
