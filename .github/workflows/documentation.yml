# Stays local: GYST has no workflow for documentation checks. These are
# path-filtered to Markdown, so they cannot be required checks.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
  pull_request:
    branches: [main]
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown files
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md'

  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links in markdown files
        run: |
          for f in $(git ls-files '*.md'); do
            npx --yes markdown-link-check@3.13.7 -q -c .markdown-link-check.json "$f"
          done

  documentation-quality:
    name: Documentation Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for required documentation
        run: |
          for doc in README.md TESTING-GUIDE.md TROUBLESHOOTING.md; do
            test -f "$doc" || { echo "Missing: $doc"; exit 1; }
            echo "Found: $doc ($(wc -l < "$doc") lines)"
          done
