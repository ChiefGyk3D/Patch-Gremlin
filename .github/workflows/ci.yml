# CI for Patch-Gremlin. The jobs live in ChiefGyk3D/git-your-ship-together; this file
# says only what is specific to this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
    with:
      shfmt-args: -i 4 -ci
      # Pre-existing: shfmt reports diffs in 9 of 11 scripts (103 hunks; see the
      # pull request). Visible but not failing until the scripts are formatted.
      shfmt-continue-on-error: true
      config-lint-install-command: pip install yamllint
      config-lint-command: |
        yamllint .
      # The old test.yml only ran `bash -n` over the scripts in debian and
      # ubuntu containers; this keeps exactly that, on x86_64 and arm64.
      test-command: |
        git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      distros: '["debian:12", "debian:13", "ubuntu:24.04"]'
      distro-runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      egress-policy: block
      extra-allowed-endpoints: ghcr.io:443 pkg-containers.githubusercontent.com:443 raw.githubusercontent.com:443 registry.npmjs.org:443   # workflow-lint: actionlint (matcher, npm) and the zizmor image
