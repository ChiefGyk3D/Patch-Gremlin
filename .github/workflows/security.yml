# CodeQL (the workflow files), gitleaks, Semgrep, dependency review and
# Scorecard and Snyk, from ChiefGyk3D/git-your-ship-together. No Python; Snyk
# gets its token from Doppler over OIDC.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@cc7fa6f48a612183ecd900ed15810da61b30288a # v1.17.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-languages: actions
      pip-audit-requirements: ""
      semgrep-config: p/github-actions p/secrets
      scorecard: true
      egress-policy: block
      # Snyk reads SNYK_TOKEN from the Doppler config over OIDC (no stored secret).
      snyk: true
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
