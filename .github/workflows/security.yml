# CodeQL (the workflow files), gitleaks, Semgrep, dependency review and
# Scorecard, from ChiefGyk3D/git-your-ship-together. No Python and no
# secret: nothing here reads Doppler.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@0e58a0e61ea8b3800d1cb0e6ed81bb860ace2094 # v1.6.3
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-languages: actions
      pip-audit-requirements: ""
      semgrep-config: p/bash p/github-actions p/secrets
      scorecard: true
      egress-policy: block
